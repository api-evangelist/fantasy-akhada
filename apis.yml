aid: fantasy-akhada
name: Fantasy Akhada
description: 'Fantasy Akhada is an Indian daily-fantasy-sports platform operated by Super Six Sports Gaming
  Private Limited (CIN U72900HR2019PTC083570) of Gurugram, Haryana, founded in 2020 by Amit Purohit, Sumit
  Kumar Jha, Sahil Ahuja, Amit Bhardwaj and Ankit Upreti, with cricket commentator Harsha Bhogle as brand
  ambassador. Users build virtual teams for real cricket, football, kabaddi, basketball and hockey fixtures
  and enter free and cash contests, with the platform taking a commission on entry fees; it marketed itself
  on the lowest commission rates in the category and claimed 3.5 to 4 million registered users. The product
  shipped only as a consumer iOS app and a sideloaded Android APK plus a React single-page web lobby -
  there is no developer program, public API, SDK, webhook surface or developer portal of any kind, and
  none has ever been published. As of the August 2026 probe the brand''s own web presence is broken:
  www.fantasyakhada.com is a dangling CNAME to a deleted AWS ap-south-1 load balancer, the apex carries
  no address record, every backend service host referenced by the company''s own JavaScript bundles has
  been withdrawn from DNS, and only stale static CloudFront/S3 builds remain. India''s Promotion and Regulation
  of Online Gaming Act 2025 banned real-money online games nationwide in August 2025.'
